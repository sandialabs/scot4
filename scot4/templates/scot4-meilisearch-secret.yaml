{{- if .Values.scot4.search.createMasterKeySecret }}
{{- $secretName := required "meilisearch.auth.existingMasterKeySecret is required when scot4.search.createMasterKeySecret is true" .Values.meilisearch.auth.existingMasterKeySecret -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $legacySecret := lookup "v1" "Secret" .Release.Namespace "scot4-env-secrets" -}}
{{- $masterKey := "" -}}
{{- if $existingSecret -}}
  {{- $existingData := default dict $existingSecret.data -}}
  {{- if hasKey $existingData "MEILI_MASTER_KEY" -}}
    {{- $masterKey = index $existingData "MEILI_MASTER_KEY" -}}
  {{- end -}}
{{- end -}}
{{- if and (not $masterKey) $legacySecret -}}
  {{- $legacyData := default dict $legacySecret.data -}}
  {{- if hasKey $legacyData "MEILI_MASTER_KEY" -}}
    {{- $masterKey = index $legacyData "MEILI_MASTER_KEY" -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName | quote }}
  labels:
    app.kubernetes.io/name: scot4-meilisearch
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  MEILI_MASTER_KEY: {{ default (randAlphaNum 50 | b64enc) $masterKey | quote }}
{{- end }}
