{{- if and (.Values.scot4.wipeApiDatabase) (.Values.scot4.api.internalDB) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: scot4-api-db-management
spec:
  template:
    metadata:
      labels:
        app: scot4-api-db-management
    spec:
      restartPolicy: "Never"
      initContainers:
      - name: scot4-wait-for-db
        image: "{{ .Values.scot4.api.repository }}:{{ .Values.scot4.api.tag }}"
        imagePullPolicy: {{ .Values.scot4.api.imagePullPolicy }}
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "Checking for the availability of the SCOT database"
          until MYSQL_PWD="$MYSQL_PASSWORD" mysql --protocol=TCP --host=scot4-db-service --user="$MYSQL_USER" --database="$MYSQL_DATABASE" --execute="SELECT 1" >/dev/null 2>&1; do
            sleep 1
            printf "-"
          done
          echo "  >> SCOT database is ready"
        env:
          - name: MYSQL_USER
            value: {{ .Values.scot4.database.apiDatabaseUser | quote }}
          - name: MYSQL_DATABASE
            value: {{ .Values.scot4.database.apiDatabaseName | quote }}
          - name: MYSQL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: scot4-env-secrets
                key: API_DB_PASSWORD
      containers:
      - name: scot4-api-wipe-db
        imagePullPolicy: {{ .Values.scot4.api.imagePullPolicy }}
        image: "{{ .Values.scot4.api.repository }}:{{ .Values.scot4.api.tag }}"
        command: ["python", "./app/db/init_db.py", "--create_tables", "--reset_db", "--create_sql_indices"]
        envFrom:
        - configMapRef:
            name: scot4-api-env-config
        - secretRef:
            name: scot4-env-secrets
      {{- if .Values.scot4.api.fakedata }}
      - name: scot4-api-fake-data
        imagePullPolicy: {{ .Values.scot4.api.imagePullPolicy }}
        image: "{{ .Values.scot4.api.utilRepository }}:{{ .Values.scot4.api.utilTag }}"
        command: ["python", "./tests/utils/initial_data.py"]
        envFrom:
        - configMapRef:
            name: scot4-api-env-config
        - secretRef:
            name: scot4-env-secrets
      {{- end }}
      {{- if (lookup "v1" "Secret" .Release.Namespace "scot4-image-pull-secret") }}
      imagePullSecrets:
      - name: scot4-image-pull-secret 
      {{- end }}
{{- end }}
