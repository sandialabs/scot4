apiVersion: v1
kind: Service
metadata:
  name: scot4-api-service
spec:
  ports:
  - port: {{ .Values.scot4.api.containerPort }}
  selector:
    app: scot4-api
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scot4-api-pv-claim
  annotations:
    volumeType: local
    helm.sh/resource-policy: "keep"
spec:
  storageClassName: {{ .Values.scot4.api.storageClassName }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.scot4.api.storageCapacity }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scot4-api
spec:
  replicas: {{ .Values.scot4.api.numReplicas }}
  selector:
    matchLabels:
      app: scot4-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.scot4.api.maxSurge }}
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: scot4-api
        {{- if .Values.scot4.forcePodRedeploy }}
        date: "{{ now | unixEpoch }}"
        {{- end }}
    spec:
      initContainers:
      {{- if .Values.scot4.api.internalDB }}
      - name: scot4-wait-for-db
        image: "{{ .Values.scot4.api.repository }}:{{ .Values.scot4.api.tag }}"
        imagePullPolicy: {{ .Values.scot4.api.imagePullPolicy }}
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "Checking for the availability of the SCOT database"
          until MYSQL_PWD="$MYSQL_PASSWORD" mysql --protocol=TCP --host=scot4-db-service --user="$MYSQL_USER" --database="$MYSQL_DATABASE" --execute="SELECT 1" >/dev/null 2>&1; do
            sleep 1
            printf "-"
          done
          echo "  >> SCOT database is ready"
        env:
          - name: MYSQL_USER
            value: {{ .Values.scot4.database.apiDatabaseUser | quote }}
          - name: MYSQL_DATABASE
            value: {{ .Values.scot4.database.apiDatabaseName | quote }}
          - name: MYSQL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: scot4-env-secrets
                key: API_DB_PASSWORD
      {{- end }}
      {{- if .Values.scot4.rebuildApiDatabaseTables }}
      - name: scot4-api-create-new-tables
        imagePullPolicy: {{ .Values.scot4.api.imagePullPolicy }}
        image: "{{ .Values.scot4.api.repository }}:{{ .Values.scot4.api.tag }}"
        command: ["python", "./app/db/init_db.py", "--create_tables"]
        envFrom:
        - configMapRef:
            name: scot4-api-env-config
        - secretRef:
            name: scot4-env-secrets
      {{- end }}
      {{- if .Values.scot4.fixApiTagSources }}
      - name: scot4-api-fix-tag-sources
        imagePullPolicy: {{ .Values.scot4.api.imagePullPolicy }}
        image: "{{ .Values.scot4.api.repository }}:{{ .Values.scot4.api.tag }}"
        command: ["python", "./app/db/init_db.py", "--fix_tag_sources"]
        envFrom:
        - configMapRef:
            name: scot4-api-env-config
        - secretRef:
            name: scot4-env-secrets
      {{- end }}
      - name: scot4-provision-search-api-key
        imagePullPolicy: {{ .Values.scot4.api.imagePullPolicy }}
        image: "{{ .Values.scot4.api.repository }}:{{ .Values.scot4.api.tag }}"
        command: ["python", "/code/scripts/meilisearch_key.py"]
        envFrom:
        - configMapRef:
            name: scot4-api-env-config
        env:
        - name: MEILI_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.meilisearch.auth.existingMasterKeySecret }}
              key: MEILI_MASTER_KEY
        - name: SEARCH_API_KEY_UID
          value: {{ .Values.scot4.search.apiKeyUid | quote }}
        - name: SEARCH_API_KEY_FILE
          value: {{ .Values.scot4.search.apiKeyFile | quote }}
        - name: SEARCH_KEY_MAX_ATTEMPTS
          value: {{ .Values.scot4.search.keyProvisioningMaxAttempts | quote }}
        - name: SEARCH_KEY_RETRY_SECONDS
          value: {{ .Values.scot4.search.keyProvisioningRetrySeconds | quote }}
        volumeMounts:
        - name: scot4-search-api-key
          mountPath: {{ dir .Values.scot4.search.apiKeyFile }}
      containers:
      - image: "{{ .Values.scot4.api.repository }}:{{ .Values.scot4.api.tag }}"
        imagePullPolicy: {{ .Values.scot4.api.imagePullPolicy }}
        name: scot4-api
        envFrom:
        - configMapRef:
            name: scot4-api-env-config
        - secretRef:
            name: scot4-env-secrets
        env:
        - name: MEILI_MASTER_KEY
          value: ""
        - name: NATS_USERNAME
          value: "{{ .Values.scot4.nats.auth.serviceAccounts.api.username }}"
        - name: NATS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.scot4.nats.auth.existingSecretName }}
              key: {{ .Values.scot4.nats.auth.secretKeys.apiServicePassword }}
        command: ["/bin/bash", "-c"]
        args:
        - |
          export SEARCH_API_KEY="$(cat {{ .Values.scot4.search.apiKeyFile }})"
          exec fastapi run app/main.py --host 0.0.0.0 --port {{ .Values.scot4.api.containerPort }} --proxy-headers
        volumeMounts:
        - name: scot4-api-files-storage 
          mountPath: /var/scot_files
          readOnly: false
        - name: scot4-search-api-key
          mountPath: {{ dir .Values.scot4.search.apiKeyFile }}
          readOnly: true
        ports:
        - containerPort: {{ .Values.scot4.api.containerPort }}
          name: scot4-api
        livenessProbe:
          httpGet:
            path: /api/v1/health/
            port: {{ .Values.scot4.api.containerPort }}
          initialDelaySeconds: {{ .Values.scot4.api.livenessInitialDelaySeconds }}
          timeoutSeconds: {{ .Values.scot4.api.livenessTimeoutSeconds }}
          periodSeconds: {{ .Values.scot4.api.livenessPeriodSeconds }}
          failureThreshold: {{ .Values.scot4.api.livenessFailureThreshold }}
        resources:
          requests:
            memory: {{ .Values.scot4.api.memoryRequests }}
          limits:
            memory: {{ .Values.scot4.api.memoryLimits }}
      volumes:
      - name: scot4-api-files-storage 
        persistentVolumeClaim:
          claimName: scot4-api-pv-claim
      - name: scot4-search-api-key
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
      securityContext:
        runAsUser: 3000
        runAsGroup: 3000
        fsGroup: 3000
      {{- if (lookup "v1" "Secret" .Release.Namespace "scot4-image-pull-secret") }}
      imagePullSecrets:
      - name: scot4-image-pull-secret 
      {{- end }}
