{{- if and .Values.scot4.basicEnrich.enabled .Values.scot4.basicEnrich.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scot4-basic-enrich-ingress
spec:
  podSelector:
    matchLabels:
      app: scot4-basic-enrich
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: scot4-api
      ports:
        - protocol: TCP
          port: {{ .Values.scot4.basicEnrich.containerPort }}
{{- end }}
