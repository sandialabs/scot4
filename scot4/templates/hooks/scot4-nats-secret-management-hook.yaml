{{- $auth := .Values.scot4.nats.auth -}}
{{- if $auth.secretManagement.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scot4-nats-secret-management
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scot4-nats-secret-management
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  resourceNames:
  - {{ $auth.existingSecretName | quote }}
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scot4-nats-secret-management
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
subjects:
- kind: ServiceAccount
  name: scot4-nats-secret-management
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scot4-nats-secret-management
---
apiVersion: batch/v1
kind: Job
metadata:
  name: scot4-nats-secret-management
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: scot4-nats-secret-management
      restartPolicy: Never
      containers:
      - name: scot4-nats-secret-management
        image: "{{ .Values.scot4.nats.authService.repository }}:{{ .Values.scot4.nats.authService.tag }}"
        imagePullPolicy: {{ .Values.scot4.nats.authService.imagePullPolicy }}
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: SECRET_NAME
          value: {{ $auth.existingSecretName | quote }}
        - name: AUTH_CALLOUT_PASSWORD_KEY
          value: {{ $auth.secretKeys.authCalloutPassword | quote }}
        - name: API_SERVICE_PASSWORD_KEY
          value: {{ $auth.secretKeys.apiServicePassword | quote }}
        - name: FLAIR_SERVICE_PASSWORD_KEY
          value: {{ $auth.secretKeys.flairServicePassword | quote }}
        - name: NATS_AUTH_ISSUER_SEED_KEY
          value: {{ $auth.secretKeys.authIssuerSeed | quote }}
        - name: NATS_AUTH_ISSUER_PUBLIC_KEY_KEY
          value: {{ $auth.secretKeys.authIssuerPublicKey | quote }}
        - name: NATS_AUTH_XKEY_SEED_KEY
          value: {{ $auth.secretKeys.authXkeySeed | quote }}
        - name: INCLUDE_XKEY_SEED
          value: {{ $auth.secretManagement.includeXkeySeed | quote }}
        - name: NO_PROXY
          value: "{{ .Values.scot4.common.noProxy }},kubernetes.default,kubernetes.default.svc,kubernetes.default.svc.cluster.local,.svc,.svc.cluster.local"
        - name: no_proxy
          value: "{{ .Values.scot4.common.noProxy }},kubernetes.default,kubernetes.default.svc,kubernetes.default.svc.cluster.local,.svc,.svc.cluster.local"
        command:
        - /bin/bash
        - -c
        - |
          python3 - <<'PY'
          import base64
          import json
          import os
          import secrets
          import ssl
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          import nkeys

          API_HOST = "https://kubernetes.default.svc"
          TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
          CA_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          SSL_CONTEXT = ssl.create_default_context(cafile=CA_PATH)
          NO_PROXY_OPENER = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPSHandler(context=SSL_CONTEXT),
          )
          PLACEHOLDERS = {
              "UPDATE-ME",
              "UPDATE_ME",
              "CHANGE-ME",
              "CHANGE_ME",
              "CHANGEME",
              "TODO",
          }


          def required_env(name):
              value = os.environ.get(name, "")
              if not value:
                  raise RuntimeError(f"missing required environment variable {name}")
              return value


          def is_placeholder(value):
              if value is None:
                  return True
              value = value.strip()
              if not value:
                  return True
              if value.upper() in PLACEHOLDERS:
                  return True
              return value.startswith("<") and value.endswith(">")


          def to_text(value):
              if isinstance(value, str):
                  return value
              return value.decode("utf-8")


          def b64encode(value):
              return base64.b64encode(value.encode("utf-8")).decode("ascii")


          def decode_secret_data(secret):
              decoded = {}
              for key, value in (secret.get("data") or {}).items():
                  decoded[key] = base64.b64decode(value).decode("utf-8")
              return decoded


          def password():
              return secrets.token_urlsafe(32)


          def account_seed():
              if hasattr(nkeys, "create_account"):
                  key_pair = nkeys.create_account()
                  return to_text(key_pair.seed)
              seed = nkeys.encode_seed(secrets.token_bytes(32), nkeys.PREFIX_BYTE_ACCOUNT)
              return to_text(seed)


          def public_key_from_seed(seed):
              key_pair = nkeys.from_seed(bytearray(seed, "utf-8"))
              return to_text(key_pair.public_key)


          def curve_seed():
              if not hasattr(nkeys, "create_curve"):
                  raise RuntimeError("nkeys.create_curve is required when INCLUDE_XKEY_SEED is enabled")
              key_pair = nkeys.create_curve()
              return to_text(key_pair.seed)


          def request(method, path, body=None, content_type="application/json"):
              with open(TOKEN_PATH, "r", encoding="utf-8") as token_file:
                  token = token_file.read().strip()
              data = None if body is None else json.dumps(body).encode("utf-8")
              req = urllib.request.Request(
                  f"{API_HOST}{path}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                      "Content-Type": content_type,
                  },
              )
              try:
                  with NO_PROXY_OPENER.open(req, timeout=20) as response:
                      payload = response.read()
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return 404, None
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"Kubernetes API {method} {path} failed: {exc.code} {detail}") from exc
              if not payload:
                  return 204, None
              return 200, json.loads(payload.decode("utf-8"))


          namespace = required_env("POD_NAMESPACE")
          secret_name = required_env("SECRET_NAME")
          secret_path = (
              f"/api/v1/namespaces/{urllib.parse.quote(namespace)}/secrets/"
              f"{urllib.parse.quote(secret_name)}"
          )

          keys = {
              "auth_callout_password": required_env("AUTH_CALLOUT_PASSWORD_KEY"),
              "api_service_password": required_env("API_SERVICE_PASSWORD_KEY"),
              "flair_service_password": required_env("FLAIR_SERVICE_PASSWORD_KEY"),
              "issuer_seed": required_env("NATS_AUTH_ISSUER_SEED_KEY"),
              "issuer_public_key": required_env("NATS_AUTH_ISSUER_PUBLIC_KEY_KEY"),
              "xkey_seed": required_env("NATS_AUTH_XKEY_SEED_KEY"),
          }
          include_xkey = os.environ.get("INCLUDE_XKEY_SEED", "false").lower() == "true"

          status, secret = request("GET", secret_path)
          exists = status != 404
          decoded = decode_secret_data(secret) if exists else {}
          updates = {}

          for key in (
              keys["auth_callout_password"],
              keys["api_service_password"],
              keys["flair_service_password"],
          ):
              if is_placeholder(decoded.get(key)):
                  updates[key] = password()

          issuer_seed = decoded.get(keys["issuer_seed"])
          if is_placeholder(issuer_seed):
              issuer_seed = account_seed()
              updates[keys["issuer_seed"]] = issuer_seed

          if is_placeholder(decoded.get(keys["issuer_public_key"])):
              updates[keys["issuer_public_key"]] = public_key_from_seed(issuer_seed)

          if include_xkey and is_placeholder(decoded.get(keys["xkey_seed"])):
              updates[keys["xkey_seed"]] = curve_seed()

          if not updates:
              print(f"{secret_name} already contains all managed NATS auth keys")
              sys.exit(0)

          encoded_updates = {key: b64encode(value) for key, value in updates.items()}
          if exists:
              request(
                  "PATCH",
                  secret_path,
                  {"data": encoded_updates},
                  content_type="application/merge-patch+json",
              )
              print(f"patched {secret_name} keys: {', '.join(sorted(updates))}")
          else:
              request(
                  "POST",
                  f"/api/v1/namespaces/{urllib.parse.quote(namespace)}/secrets",
                  {
                      "apiVersion": "v1",
                      "kind": "Secret",
                      "metadata": {
                          "name": secret_name,
                          "labels": {
                              "app.kubernetes.io/managed-by": "Helm",
                              "app.kubernetes.io/name": "scot4",
                              "app.kubernetes.io/component": "nats-auth",
                          },
                      },
                      "type": "Opaque",
                      "data": encoded_updates,
                  },
              )
              print(f"created {secret_name} keys: {', '.join(sorted(updates))}")
          PY
      {{- if (lookup "v1" "Secret" .Release.Namespace "scot4-image-pull-secret") }}
      imagePullSecrets:
      - name: scot4-image-pull-secret
      {{- end }}
{{- end }}
