{{- if and .Values.scot4.api.internalDB .Values.scot4.database.rootPasswordSecret.create }}
{{- $secretName := required "scot4.database.rootPasswordSecret.name is required when creating the internal database root Secret" .Values.scot4.database.rootPasswordSecret.name -}}
{{- $secretKey := required "scot4.database.rootPasswordSecret.key is required when creating the internal database root Secret" .Values.scot4.database.rootPasswordSecret.key -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $legacySecret := lookup "v1" "Secret" .Release.Namespace "scot4-env-secrets" -}}
{{- $rootPassword := "" -}}
{{- if $existingSecret -}}
  {{- $existingData := default dict $existingSecret.data -}}
  {{- if hasKey $existingData $secretKey -}}
    {{- $rootPassword = index $existingData $secretKey -}}
  {{- end -}}
{{- end -}}
{{- if and (not $rootPassword) $legacySecret -}}
  {{- $legacyData := default dict $legacySecret.data -}}
  {{- if hasKey $legacyData "ROOT_DB_PASSWORD" -}}
    {{- $rootPassword = index $legacyData "ROOT_DB_PASSWORD" -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName | quote }}
  labels:
    app.kubernetes.io/name: scot4-database
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{ $secretKey | quote }}: {{ default (randAlphaNum 50 | b64enc) $rootPassword | quote }}
{{- end }}
