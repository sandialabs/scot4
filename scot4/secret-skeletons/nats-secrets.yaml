apiVersion: v1
kind: Secret
metadata:
  name: scot4-nats-secrets
type: Opaque
stringData:
  AUTH_CALLOUT_PASSWORD: <password used by the auth callout service account>
  API_SERVICE_PASSWORD: <password used by the SCOT API NATS service account>
  FLAIR_SERVICE_PASSWORD: <password used by the Flair NATS service account>
  NATS_AUTH_ISSUER_SEED: <seed for the auth callout issuer keypair>
  NATS_AUTH_ISSUER_PUBLIC_KEY: <public key for the auth callout issuer keypair>
  NATS_AUTH_XKEY_SEED: <seed for the auth callout xkey keypair>
